[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kvcomp"
version = "0.1.0"
description = "KV-cache compression benchmarking for memory-constrained GPUs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4",
    "transformers>=5.0",
    "accelerate>=1.0",
    "bitsandbytes>=0.43; platform_system != 'Darwin'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[tool.setuptools.packages.find]
include = ["kvcomp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# GPU tests need a CUDA device and a downloaded model, so they are opt-in:
#   pytest -m gpu
addopts = "-m 'not gpu' --strict-markers"
markers = [
    "gpu: requires a CUDA device and model weights",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
